<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230E2A52%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2716%27 fill=%27%23E4F55B%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2A52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<!-- Page 404 du modèle coach. GitHub Pages la sert pour toute adresse inconnue, à n'importe quelle
     profondeur : les fichiers sont donc appelés depuis la racine du site (/assets/...). -->
<style>
  :root {
    --brand: #0E2A52; --ball: #E4F55B; --on-brand: #FFFFFF; --on-brand-muted: rgba(255, 255, 255, .74);
    --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
    --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100%; display: flex; flex-direction: column;
    background: var(--brand); color: var(--on-brand); font: 400 17px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    position: relative; overflow-x: hidden;
  }
  body::before { /* lignes du court en fond */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .13;
    background:
      linear-gradient(90deg, transparent calc(50% - 1px), #fff calc(50% - 1px), #fff calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(0deg, transparent calc(28% - 1px), #fff calc(28% - 1px), #fff calc(28% + 1px), transparent calc(28% + 1px)),
      linear-gradient(0deg, transparent calc(72% - 1px), #fff calc(72% - 1px), #fff calc(72% + 1px), transparent calc(72% + 1px));
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ball); outline-offset: 3px; border-radius: 6px; }
  .top { position: relative; display: flex; align-items: center; gap: 10px; min-height: 68px; max-width: 1080px; width: 100%; margin: 0 auto;
    font: 800 15px/1 var(--f-display); font-stretch: 112%; letter-spacing: .05em; text-decoration: none; }
  .top img { height: 34px; width: auto; }
  .mark { width: 18px; height: 18px; border-radius: 50%; background: var(--ball); box-shadow: inset -4px -3px 0 rgba(0, 0, 0, .12); flex: none; }
  main { position: relative; flex: 1; display: grid; place-items: center; text-align: center; padding: 24px 0 64px; }
  .inner { max-width: 560px; }
  .code { display: flex; justify-content: center; align-items: center; gap: .06em; margin: 0 0 8px;
    font: 900 clamp(110px, 30vw, 200px)/.9 var(--f-display); font-stretch: 118%; letter-spacing: -.02em; }
  .ball { position: relative; width: .74em; height: .74em; border-radius: 50%; background: var(--ball);
    box-shadow: inset -.09em -.07em 0 rgba(0, 0, 0, .14), 0 .08em .16em rgba(0, 0, 0, .3); animation: bounce 1.6s cubic-bezier(.3, 0, .4, 1) infinite; }
  .ball::before, .ball::after { content: ""; position: absolute; top: 8%; bottom: 8%; width: 46%; border: .028em solid rgba(255, 255, 255, .9); border-radius: 50%; }
  .ball::before { left: -22%; border-left-color: transparent; border-top-color: transparent; border-bottom-color: transparent; }
  .ball::after { right: -22%; border-right-color: transparent; border-top-color: transparent; border-bottom-color: transparent; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-.16em); } 55% { transform: translateY(-.16em); } }
  @media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
  h1 { margin: 0 0 12px; font: 900 clamp(32px, 7vw, 48px)/1.05 var(--f-display); font-stretch: 112%; text-transform: uppercase; color: var(--ball); }
  p { margin: 0 auto 30px; max-width: 30em; color: var(--on-brand-muted); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 999px;
    border: 2px solid transparent; font: 700 16px/1.2 var(--f-body); text-decoration: none; transition: transform .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn--ball { background: var(--ball); color: var(--brand); }
  .btn--ghost { border-color: rgba(255, 255, 255, .45); }
  .more { margin: 26px 0 0; font-size: 15px; color: var(--on-brand-muted); }
  @media (max-width: 420px) { .actions .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<a class="top" href="/" id="brand"><span class="mark" aria-hidden="true"></span><span id="brand-text">COACH PADEL</span></a>
<main>
  <div class="inner">
    <div class="code" aria-hidden="true"><span>4</span><span class="ball"></span><span>4</span></div>
    <h1>Balle dehors !</h1>
    <p id="msg">Cette page n'existe pas ou a été déplacée. Pas de panique, le terrain est juste à côté.</p>
    <div class="actions">
      <a class="btn btn--ball" href="/#reserver" data-keep-slug>Réserver une séance</a>
      <a class="btn btn--ghost" href="/" data-keep-slug>Retour à l'accueil</a>
    </div>
    <p class="more"><a href="/#contact" data-keep-slug id="contact-link">Une question ? Écrivez au coach</a></p>
  </div>
</main>
<script src="/assets/config.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/demo-data.js"></script>
<script src="/assets/api.js"></script>
<script>
// Aux couleurs et au nom du coach. Sans réseau, la page reste lisible avec les couleurs par défaut.
(async () => {
  const P = window.PCW;
  if (!P || !P.backend) return;
  const q = new URLSearchParams(location.search).get("c");
  if (q) document.querySelectorAll("[data-keep-slug]").forEach((a) => {
    const [path, hash] = a.getAttribute("href").split("#");
    a.href = `${path}?c=${encodeURIComponent(q)}${hash ? "#" + hash : ""}`;
  });
  try {
    const api = await P.backend();
    const site = await api.getSite(P.currentSlug());
    if (!site) return;
    const t = site.theme || {}, name = site.coach.display_name;
    P.setFavicon(t);
    const s = document.documentElement.style;
    if (P.hexToRgb(t.primary)) {
      s.setProperty("--brand", t.primary);
      s.setProperty("--on-brand", P.readableOn(t.primary));
      s.setProperty("--on-brand-muted", P.readableOn(t.primary) === "#FFFFFF" ? "rgba(255,255,255,.74)" : "rgba(11,24,48,.7)");
      document.querySelector('meta[name="theme-color"]').content = t.primary;
    }
    if (P.hexToRgb(t.accent)) s.setProperty("--ball", t.accent);
    if (t.font_display) s.setProperty("--f-display", `"${t.font_display}", "Arial Narrow", system-ui, sans-serif`);
    if (t.font_body) s.setProperty("--f-body", `"${t.font_body}", system-ui, sans-serif`);
    if (P.fontsUrl) document.getElementById("font-link").href = P.fontsUrl(t.font_display, t.font_body);
    document.getElementById("brand-text").textContent = t.logo_text || name.toUpperCase();
    if (t.logo_url && /^https:\/\//.test(t.logo_url)) {
      const img = new Image(); img.src = t.logo_url; img.alt = name;
      const b = document.getElementById("brand"); b.textContent = ""; b.appendChild(img);
    }
    document.title = `Page introuvable · ${name}`;
    document.getElementById("contact-link").textContent = `Une question ? Écrivez à ${name}`;
  } catch (e) { /* page par défaut */ }
})();
</script>
</body>
</html>
